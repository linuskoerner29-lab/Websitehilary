<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urlaubsplan</title>
<style>
  :root {
    --accent: #2a7f6e;
    --accent-light: #e4f3f0;
    --bg: #f7f7f5;
    --card-bg: #ffffff;
    --text: #222;
    --muted: #767676;
    --border: #e0e0e0;
    --today: #d98c2b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 6px 16px;
  }
  .header-top h1 {
    font-size: 1.3rem;
    margin: 0;
  }
  #adminBtn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  #adminBtn:hover { opacity: 0.9; }

  .tabs {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 6px 12px 12px 12px;
    scrollbar-width: thin;
  }
  .tab {
    flex: 0 0 auto;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fafafa;
    cursor: pointer;
    text-align: center;
    min-width: 66px;
    position: relative;
    transition: background 0.15s, color 0.15s;
  }
  .tab .wd { display: block; font-size: 0.72rem; color: var(--muted); }
  .tab .dt { display: block; font-weight: 600; font-size: 0.95rem; }
  .tab.today { border-color: var(--today); }
  .tab.today::after {
    content: "heute";
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--today);
    color: white;
    font-size: 0.6rem;
    padding: 1px 6px;
    border-radius: 999px;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
  }
  .tab.active .wd, .tab.active .dt { color: white; }

  .page-layout {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    align-items: flex-start;
    gap: 4px;
  }
  main {
    max-width: 720px;
    flex: 1;
    min-width: 0;
    margin: 20px auto;
    padding: 0 16px 60px 16px;
  }
  .weather-panel {
    width: 320px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-top: 20px;
    padding-left: 16px;
  }
  .weather-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .weather-card h4 {
    margin: 0 0 10px 0;
    font-size: 1.1rem;
  }
  .weather-section-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    font-weight: 700;
    margin: 12px 0 4px 0;
  }
  .weather-section-label:first-child { margin-top: 0; }
  .weather-day-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.98rem;
    padding: 5px 0;
  }
  .weather-day-row .wd {
    color: var(--muted);
    width: 52px;
  }
  .weather-day-row .icon { font-size: 1.4rem; }
  .weather-day-row .temps { font-weight: 600; }
  .weather-day-row .temps .min {
    color: var(--muted);
    font-weight: 400;
    margin-left: 4px;
  }
  .weather-toggle {
    width: 100%;
    margin-top: 8px;
    background: none;
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 7px;
    border-radius: 8px;
    cursor: pointer;
  }
  .weather-toggle:hover { background: var(--accent-light); }
  .weather-details { margin-top: 6px; }
  .weather-chart {
    width: 100%;
    margin-bottom: 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .weather-chart svg { display: block; height: 220px; width: 480px; }
  .weather-chart-hint {
    font-size: 0.7rem;
    color: var(--muted);
    margin: -2px 0 6px 0;
  }
  /* Wide screens (laptop/desktop): show the whole day at once, bigger and without scrolling */
  @media (min-width: 801px) {
    .weather-panel { width: 480px; }
    .weather-chart { overflow-x: visible; }
    .weather-chart svg { width: 100%; height: auto; }
    .weather-chart-hint { display: none; }
  }
  @media (max-width: 800px) {
    .page-layout { flex-direction: column; }
    .weather-panel {
      width: 100%;
      flex-direction: row;
      flex-wrap: wrap;
      padding-left: 0;
      margin-top: 12px;
    }
    .weather-card { flex: 1; min-width: 220px; }
    main { margin: 0 auto; }
  }
  .day-heading {
    margin: 4px 0 16px 0;
  }
  .day-heading h2 {
    margin: 0;
    font-size: 1.4rem;
  }
  .day-heading .sub {
    color: var(--muted);
    font-size: 0.9rem;
  }

  .event {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    position: relative;
  }
  .event.highlight {
    border-color: var(--accent);
    background: var(--accent-light);
  }
  .event .time {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
  }
  .event h3 {
    margin: 4px 0 6px 0;
    font-size: 1.05rem;
  }
  .event p {
    margin: 0;
    font-size: 0.9rem;
    color: #444;
  }
  .event .rich-content {
    font-size: 0.9rem;
    color: #444;
    margin-bottom: 4px;
  }
  .event .rich-content p { margin: 0 0 6px 0; }
  .star {
    position: absolute;
    top: 12px;
    right: 14px;
    font-size: 1rem;
  }
  .event .links {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .event .links a {
    display: inline-block;
    font-size: 0.8rem;
    text-decoration: none;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .event .links a:hover { background: var(--accent-light); }
  .event .photos {
    margin-top: 10px;
    display: flex;
    gap: 8px;
  }
  .event .expand-toggle {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid var(--border);
    color: var(--accent);
    font-weight: 600;
    font-size: 0.85rem;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
  }
  .event .expand-toggle:hover { background: var(--accent-light); }
  .event .expandable-body {
    margin-top: 8px;
    font-size: 0.88rem;
    color: #444;
  }
  .event .expandable-body table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
    margin-top: 4px;
  }
  .event .expandable-body td {
    padding: 5px 6px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .event .expandable-body td:first-child {
    white-space: nowrap;
    font-weight: 600;
    color: var(--accent);
  }
  .event .photos img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: block;
    cursor: pointer;
  }

  /* Lightbox */
  .lightbox-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .lightbox-backdrop.open { display: flex; }
  .lightbox-backdrop img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 6px;
  }
  .lightbox-close, .lightbox-prev, .lightbox-next {
    position: absolute;
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    font-size: 1.6rem;
    cursor: pointer;
    border-radius: 50%;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover { background: rgba(255,255,255,0.3); }
  .lightbox-close { top: 16px; right: 16px; }
  .lightbox-prev { left: 16px; top: 50%; transform: translateY(-50%); }
  .lightbox-next { right: 16px; top: 50%; transform: translateY(-50%); }
  .lightbox-counter {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 0.85rem;
    background: rgba(0,0,0,0.4);
    padding: 3px 10px;
    border-radius: 999px;
  }
  @media (max-width: 600px) {
    .lightbox-prev, .lightbox-next, .lightbox-close {
      width: 40px; height: 40px; font-size: 1.3rem;
    }
  }
  .empty-note {
    color: var(--muted);
    font-style: italic;
    padding: 20px 0;
    text-align: center;
  }

  /* Modal */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: white;
    border-radius: 10px;
    padding: 20px;
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h2 { margin-top: 0; font-size: 1.2rem; }
  .modal input[type="password"], .modal input[type="text"], .modal input[type="datetime-local"], .modal textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    margin-top: 4px;
    margin-bottom: 10px;
    font-family: inherit;
  }
  .modal textarea { min-height: 60px; resize: vertical; }
  .modal label { font-size: 0.82rem; font-weight: 600; color: #444; }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 10px;
  }
  .btn {
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 0.88rem;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: #eee; color: #333; }
  .btn-danger { background: #c0392b; color: white; }
  .error-msg { color: #c0392b; font-size: 0.85rem; margin-top: -4px; margin-bottom: 8px; }

  .admin-daypicker {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .admin-daypicker button {
    padding: 5px 8px;
    font-size: 0.78rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fafafa;
    cursor: pointer;
  }
  .admin-daypicker button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .admin-event {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    background: #fafafa;
  }
  .admin-event .row {
    display: flex;
    gap: 8px;
  }
  .admin-event .row > div { flex: 1; }
  .admin-event .checkbox-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .admin-event .lock-note {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .admin-note {
    font-size: 0.8rem;
    color: var(--muted);
    background: #fff9ec;
    border: 1px solid #f0e0b0;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 14px;
  }

  .template-badge {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    background: var(--accent-light);
    color: var(--accent);
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .fields-container {
    margin: 10px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .field-row {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    background: white;
  }
  .field-row-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .field-label {
    font-size: 0.78rem;
    font-weight: 600;
    color: #555;
  }
  .field-remove {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 2px 6px;
  }
  .field-remove:hover { color: #c0392b; }
  .field-row input[type="text"] { margin-bottom: 0; }
  .add-field-row, .add-event-templates {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: 10px 0 16px 0;
  }
  .btn-add-field, .btn-add-template {
    font-size: 0.78rem;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px dashed var(--accent);
    background: white;
    color: var(--accent);
    cursor: pointer;
  }
  .btn-add-field:hover, .btn-add-template:hover { background: var(--accent-light); }

  .rte-toolbar {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
  }
  .rte-toolbar button {
    width: 28px;
    height: 26px;
    border: 1px solid var(--border);
    background: #fafafa;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.82rem;
  }
  .rte-toolbar button:hover { background: #eee; }
  .rte-toolbar select {
    font-size: 0.78rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 4px;
  }
  .rte-box {
    min-height: 60px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font-size: 0.9rem;
    outline: none;
  }
  .rte-box:focus { border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1 id="tripTitle">Urlaub</h1>
    <button id="adminBtn">Admin</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="page-layout">
  <aside class="weather-panel" id="weatherPanel">
    <div class="weather-card" id="weatherBasel">
      <h4>📍 Basel</h4>
      <div class="weather-summary">Lädt…</div>
      <button class="weather-toggle" type="button">▼ Mehr anzeigen</button>
      <div class="weather-details" style="display:none;"></div>
    </div>
    <div class="weather-card" id="weatherBozen">
      <h4>📍 Bozen</h4>
      <div class="weather-summary">Lädt…</div>
      <button class="weather-toggle" type="button">▼ Mehr anzeigen</button>
      <div class="weather-details" style="display:none;"></div>
    </div>
  </aside>

  <main>
    <div class="day-heading">
      <h2 id="dayTitle"></h2>
      <div class="sub" id="daySub"></div>
    </div>
    <div id="eventList"></div>
  </main>
</div>

<!-- Lightbox for viewing images full-size -->
<div class="lightbox-backdrop" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <button class="lightbox-prev" id="lightboxPrev">‹</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-next" id="lightboxNext">›</button>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<!-- Password modal -->
<div class="modal-backdrop" id="pwBackdrop">
  <div class="modal">
    <h2>Admin-Zugang</h2>
    <label for="pwInput">Passwort</label>
    <input type="password" id="pwInput" placeholder="Passwort eingeben">
    <div class="error-msg" id="pwError" style="display:none;">Falsches Passwort.</div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="pwCancel">Abbrechen</button>
      <button class="btn btn-primary" id="pwSubmit">Bestätigen</button>
    </div>
  </div>
</div>

<!-- Admin modal -->
<div class="modal-backdrop" id="adminBackdrop">
  <div class="modal" style="max-width:600px;">
    <h2>Admin-Bereich</h2>
    <div class="admin-note">
      Änderungen werden in der gemeinsamen Datenbank gespeichert und sind für alle Besucher der Seite sichtbar.
    </div>
    <div class="admin-note" id="syncStatus">Verbindung wird hergestellt…</div>
    <div id="importPreparedWrap"></div>
    <div class="admin-daypicker" id="adminDaypicker"></div>
    <div id="adminEventList"></div>
    <label>Neues Event anlegen aus Vorlage</label>
    <div class="add-event-templates" id="addEventTemplates"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="adminClose">Schließen</button>
      <button class="btn btn-primary" id="adminSave">Speichern</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAAPzLz1bAf1CXTIBl7myYheDGx5AnqjMM",
  authDomain: "hilaryeurope.firebaseapp.com",
  projectId: "hilaryeurope",
  storageBucket: "hilaryeurope.firebasestorage.app",
  messagingSenderId: "335576706334",
  appId: "1:335576706334:web:f66b291e056caca078ad0f"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
const tripDocRef = doc(db, "trip", "main");
const ADMIN_EMAIL = "hilary@europe2026.com";

(function() {
  const TRIP_START = "2026-10-08";
  const TRIP_END = "2026-10-17";

  // ---------- Date helpers ----------
  function dateRange(startStr, endStr) {
    const dates = [];
    let d = new Date(startStr + "T00:00:00");
    const end = new Date(endStr + "T00:00:00");
    while (d <= end) {
      // Build the date string from local year/month/day (not toISOString, which converts
      // to UTC and would shift the date back by one day in timezones ahead of UTC, e.g. CET/CEST).
      dates.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0'));
      d.setDate(d.getDate() + 1);
    }
    return dates;
  }

  function formatDayLabel(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const weekday = d.toLocaleDateString('de-DE', { weekday: 'short' });
    const dm = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
    return { weekday, dm };
  }

  function formatDayHeading(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const weekday = d.toLocaleDateString('de-DE', { weekday: 'long' });
    const full = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
    return weekday + ", " + full + ".";
  }

  function todayStr() {
    const n = new Date();
    return n.getFullYear() + "-" + String(n.getMonth()+1).padStart(2,'0') + "-" + String(n.getDate()).padStart(2,'0');
  }

  const ALL_DATES = dateRange(TRIP_START, TRIP_END);

  // ---------- Field types & templates ----------
  const FIELD_TYPE_INFO = {
    time:       { label: 'Uhrzeit',     icon: '⏰' },
    image:      { label: 'Bild',        icon: '🖼️' },
    link:       { label: 'Link',        icon: '🔗' },
    richtext:   { label: 'Text',        icon: '📝' },
    expandable: { label: 'Ausklappbar', icon: '📂' }
  };

  function mkField(type, value) {
    const f = { id: cryptoId(), type, value: value || '' };
    if (type === 'expandable') f.label = 'Details anzeigen';
    return f;
  }

  const TEMPLATES = {
    aktivitaet: {
      label: 'Aktivität', icon: '🏃',
      build: () => [ mkField('time'), mkField('richtext'), mkField('link'), mkField('image'), mkField('image') ]
    },
    viewpoint: {
      label: 'Viewpoint', icon: '📷',
      build: () => [ mkField('image'), mkField('image') ]
    },
    frei: {
      label: 'Frei', icon: '✏️',
      build: () => [ mkField('richtext') ]
    }
  };

  // Converts events saved in the old (pre-template) format into the new field-based format,
  // so nothing already stored in the database gets lost.
  function migrateEvent(ev) {
    if (Array.isArray(ev.fields)) return ev;
    const fields = [];
    if (ev.time) fields.push(mkField('time', ev.time));
    if (ev.description) fields.push(mkField('richtext', '<p>' + escapeHtml(ev.description) + '</p>'));
    if (ev.mapsLink) fields.push(mkField('link', ev.mapsLink));
    if (ev.website) fields.push(mkField('link', ev.website));
    (ev.images || []).forEach(url => { if (url) fields.push(mkField('image', url)); });
    return {
      id: ev.id || cryptoId(),
      templateType: 'frei',
      title: ev.title || '',
      highlight: !!ev.highlight,
      visibleFrom: ev.visibleFrom || null,
      fields
    };
  }

  function getTimeValue(ev) {

  function addDaysISO(dateStr, days) {
    const d = new Date(dateStr + "T09:00:00");
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0,16);
  }

  function cryptoId() {
    return 'e' + Math.random().toString(36).slice(2, 10);
  }

  // Live sync: every visitor's page updates automatically when the admin saves
  onSnapshot(tripDocRef, (snap) => {
    if (snap.exists()) {
      tripData = snap.data();
      // migrate any events still in the old format (keeps older saved data working)
      Object.keys(tripData).forEach(date => {
        const day = tripData[date];
        if (day && Array.isArray(day.events)) {
          day.events = day.events.map(migrateEvent);
        }
      });
    } else {
      // first ever run: seed the database with the example data
      tripData = defaultData();
      setDoc(tripDocRef, tripData).catch(err => console.error('Seed write failed', err));
    }
    lastSyncedData = JSON.parse(JSON.stringify(tripData));
    if (syncStatusEl) {
      syncStatusEl.textContent = 'Verbunden – Änderungen werden geteilt.';
    }
    renderDay();
    if (adminBackdrop.classList.contains('open')) {
      renderAdminEvents();

      btn.className = 'tab' + (date === selectedDate ? ' active' : '') + (date === today ? ' today' : '');
      btn.innerHTML = '<span class="wd">' + weekday + '</span><span class="dt">' + dm + '</span>';

  // ---------- Rendering: Day content ----------
  const dayTitleEl = document.getElementById('dayTitle');
  const daySubEl = document.getElementById('daySub');
  const eventListEl = document.getElementById('eventList');

  function renderDay() {
    dayTitleEl.textContent = formatDayHeading(selectedDate);
    const idx = ALL_DATES.indexOf(selectedDate) + 1;
    daySubEl.textContent = 'Tag ' + idx + ' von ' + ALL_DATES.length;

    const now = new Date();
    const events = (tripData[selectedDate] && tripData[selectedDate].events) || [];
    const visibleEvents = events.filter(ev => isVisible(ev, now));
    visibleEvents.sort((a,b) => (getTimeValue(a)||'').localeCompare(getTimeValue(b)||''));

    eventListEl.innerHTML = '';
    if (visibleEvents.length === 0) {
      eventListEl.innerHTML = '<div class="empty-note">Für diesen Tag ist noch nichts geplant.</div>';
      return;
    }
    visibleEvents.forEach(ev => {
      const div = document.createElement('div');
      div.className = 'event' + (ev.highlight ? ' highlight' : '');
      const fields = ev.fields || [];
      const timeVal = getTimeValue(ev);
      const richtexts = fields.filter(f => f.type === 'richtext' && f.value);
      const links = fields.filter(f => f.type === 'link' && f.value);
      const images = fields.filter(f => f.type === 'image' && f.value);
      const expandables = fields.filter(f => f.type === 'expandable' && f.value);

      let html =
        (ev.highlight ? '<span class="star">⭐</span>' : '') +
        (timeVal ? '<div class="time">' + escapeHtml(timeVal) + '</div>' : '') +
        '<h3>' + escapeHtml(ev.title) + '</h3>';

      richtexts.forEach(f => {
        html += '<div class="rich-content">' + f.value + '</div>';
      });

      if (links.length) {
        html += '<div class="links">' + links.map(f =>
          '<a href="' + escapeAttr(f.value) + '" target="_blank" rel="noopener">🔗 Link öffnen</a>'
        ).join('') + '</div>';
      }

      if (images.length) {
        html += '<div class="photos">' + images.map((f, idx) =>
          '<img class="photo-thumb" data-idx="' + idx + '" src="' + escapeAttr(f.value) + '" alt="' + escapeAttr(ev.title) + '" loading="lazy">'
        ).join('') + '</div>';
      }

      expandables.forEach(f => {
        const label = f.label || 'Details anzeigen';
        html += '<button type="button" class="expand-toggle" data-label="' + escapeAttr(label) + '">▼ ' + escapeHtml(label) + '</button>' +
          '<div class="expandable-body" style="display:none;">' + f.value + '</div>';
      });

      div.innerHTML = html;
      eventListEl.appendChild(div);

      if (images.length) {
        const urls = images.map(f => f.value);
        div.querySelectorAll('.photo-thumb').forEach(thumb => {
          thumb.addEventListener('click', () => openLightbox(urls, parseInt(thumb.dataset.idx, 10)));
        });
      }

      div.querySelectorAll('.expand-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const body = btn.nextElementSibling;
          const isOpen = body.style.display !== 'none';
          body.style.display = isOpen ? 'none' : 'block';
          btn.textContent = (isOpen ? '▼ ' : '▲ ') + btn.dataset.label;
        });
      });
    });
  }

  // ---------- Lightbox (view images full-size, navigate with arrows) ----------
  const lightboxEl = document.getElementById('lightbox');

  const lightboxCounterEl = document.getElementById('lightboxCounter');
  const lightboxPrevBtn = document.getElementById('lightboxPrev');
  const lightboxNextBtn = document.getElementById('lightboxNext');
  const lightboxCloseBtn = document.getElementById('lightboxClose');
  let lightboxImages = [];
  let lightboxIndex = 0;

  function openLightbox(urls, index) {
    lightboxImages = urls;
    lightboxIndex = index;
    showLightboxImage();
    lightboxEl.classList.add('open');
  }

  function closeLightbox() {
    lightboxEl.classList.remove('open');
  }

  function showLightboxImage() {
    lightboxImgEl.src = lightboxImages[lightboxIndex];
    const multi = lightboxImages.length > 1;
    lightboxPrevBtn.style.display = multi ? 'flex' : 'none';
    lightboxNextBtn.style.display = multi ? 'flex' : 'none';
    lightboxCounterEl.style.display = multi ? 'block' : 'none';
    lightboxCounterEl.textContent = (lightboxIndex + 1) + ' / ' + lightboxImages.length;
  }

  function lightboxPrev() {
    lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
    showLightboxImage();
  }

  function lightboxNext() {
    lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
    showLightboxImage();
  }

  lightboxCloseBtn.addEventListener('click', closeLightbox);
  lightboxPrevBtn.addEventListener('click', lightboxPrev);
  lightboxNextBtn.addEventListener('click', lightboxNext);
  lightboxEl.addEventListener('click', (e) => {
    if (e.target === lightboxEl) closeLightbox(); // click on the dark backdrop closes it
  });
  document.addEventListener('keydown', (e) => {
    if (!lightboxEl.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') lightboxPrev();
    else if (e.key === 'ArrowRight') lightboxNext();
  });

  function importPreparedEvents() {
    const BATCH_ID = 'oct2026-v1';
    let addedAny = false;
    Object.keys(SEED_EVENTS_OCT2026).forEach(date => {
      if (!tripData[date]) tripData[date] = { events: [] };
      const already = tripData[date].events.some(e => e._importBatch === BATCH_ID);
      if (already) return;
      tripData[date].events = tripData[date].events.concat(SEED_EVENTS_OCT2026[date]);
      addedAny = true;
    });
    renderAdminDaypicker();
    renderAdminEvents();
    if (addedAny) {
      alert('Ereignisse eingefügt. Bitte prüfen und dann oben auf "Speichern" klicken, damit sie für alle Besucher sichtbar werden.');

    removeBtn.className = 'field-remove';
    removeBtn.textContent = '✕ entfernen';
    removeBtn.addEventListener('click', () => {
      ev.fields = ev.fields.filter(f => f.id !== field.id);
      renderAdminEvents();
    });
    header.appendChild(labelSpan);
    header.appendChild(removeBtn);
    row.appendChild(header);

    if (field.type === 'time') {
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '14:00';
      input.value = field.value || '';
      input.addEventListener('input', e => field.value = e.target.value);
      row.appendChild(input);
    } else if (field.type === 'image') {
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Bild-URL';
      input.value = field.value || '';
      input.addEventListener('input', e => field.value = e.target.value);
      row.appendChild(input);
    } else if (field.type === 'link') {
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'https://...';
      input.value = field.value || '';
      input.addEventListener('input', e => field.value = e.target.value);
      row.appendChild(input);
    } else if (field.type === 'richtext') {
      const toolbar = document.createElement('div');
      toolbar.className = 'rte-toolbar';
      const editable = document.createElement('div');
      editable.className = 'rte-box';
      editable.contentEditable = 'true';
      editable.innerHTML = field.value || '';
      editable.addEventListener('input', () => field.value = editable.innerHTML);

      const mkBtn = (cmd, label, title) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = label;
        b.title = title;
        b.addEventListener('mousedown', e => {
          e.preventDefault();
          editable.focus();
          document.execCommand(cmd, false, null);
          field.value = editable.innerHTML;
        });
        return b;
      };
      toolbar.appendChild(mkBtn('bold', 'B', 'Fett'));
      toolbar.appendChild(mkBtn('italic', 'I', 'Kursiv'));
      toolbar.appendChild(mkBtn('underline', 'U', 'Unterstrichen'));
      toolbar.appendChild(mkBtn('strikeThrough', 'S', 'Durchgestrichen'));

      const sizeSelect = document.createElement('select');
      [['2','Klein'], ['3','Normal'], ['5','Groß'], ['7','Riesig']].forEach(([val, label]) => {
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = label;
        sizeSelect.appendChild(opt);
      });
      sizeSelect.value = '3';
      sizeSelect.addEventListener('mousedown', e => e.stopPropagation());
      sizeSelect.addEventListener('change', () => {
        editable.focus();
        document.execCommand('fontSize', false, sizeSelect.value);
        field.value = editable.innerHTML;
      });
      toolbar.appendChild(sizeSelect);

      row.appendChild(toolbar);
      row.appendChild(editable);
    } else if (field.type === 'expandable') {
      const labelInput = document.createElement('input');
      labelInput.type = 'text';
      labelInput.placeholder = 'Button-Text, z. B. "Route im Detail anzeigen"';
      labelInput.value = field.label || '';
      labelInput.style.marginBottom = '8px';
      labelInput.addEventListener('input', e => field.label = e.target.value);
      row.appendChild(labelInput);

      const toolbar = document.createElement('div');
      toolbar.className = 'rte-toolbar';
      const editable = document.createElement('div');
      editable.className = 'rte-box';
      editable.contentEditable = 'true';
      editable.innerHTML = field.value || '';
      editable.addEventListener('input', () => field.value = editable.innerHTML);

      const mkBtn = (cmd, label, title) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = label;
        b.title = title;
        b.addEventListener('mousedown', e => {
          e.preventDefault();
          editable.focus();
          document.execCommand(cmd, false, null);
          field.value = editable.innerHTML;
        });
        return b;
      };
      toolbar.appendChild(mkBtn('bold', 'B', 'Fett'));
      toolbar.appendChild(mkBtn('italic', 'I', 'Kursiv'));
      toolbar.appendChild(mkBtn('underline', 'U', 'Unterstrichen'));
      toolbar.appendChild(mkBtn('strikeThrough', 'S', 'Durchgestrichen'));

      const sizeSelect = document.createElement('select');
      [['2','Klein'], ['3','Normal'], ['5','Groß'], ['7','Riesig']].forEach(([val, label]) => {
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = label;
        sizeSelect.appendChild(opt);
      });
      sizeSelect.value = '3';
      sizeSelect.addEventListener('mousedown', e => e.stopPropagation());
      sizeSelect.addEventListener('change', () => {
        editable.focus();
        document.execCommand('fontSize', false, sizeSelect.value);
        field.value = editable.innerHTML;
      });
      toolbar.appendChild(sizeSelect);

      row.appendChild(toolbar);
      row.appendChild(editable);
      const hint = document.createElement('div');
      hint.style.fontSize = '0.72rem';
      hint.style.color = 'var(--muted)';
      hint.style.marginTop = '4px';
      hint.textContent = 'Tipp: Für Tabellen (z. B. Routenpläne) kann auch HTML eingefügt werden.';
      row.appendChild(hint);
    }

    return row;
  }

  function escapeAttr(str) {
    return (str || '').replace(/"/g, '&quot;');
  }

  adminClose.addEventListener('click', () => {
    adminBackdrop.classList.remove('open');
    tripData = JSON.parse(JSON.stringify(lastSyncedData || defaultData())); // discard unsaved in-memory edits
    renderDay();
    signOut(auth).catch(() => {});
    isAdmin = false;
  });

  adminSave.addEventListener('click', () => {
    adminSave.disabled = true;
    adminSave.textContent = 'Speichert…';
    saveData()
      .then(() => {
        adminBackdrop.classList.remove('open');
        signOut(auth).catch(() => {});
        isAdmin = false;
      })
      .catch(err => {
        console.error(err);
        alert('Speichern fehlgeschlagen. Bitte Internetverbindung prüfen und erneut versuchen.');
      })
      .finally(() => {
        adminSave.disabled = false;
        adminSave.textContent = 'Speichern';
      });
  });

  // ---------- Weather: 7-day forecast for Basel & Bozen, starting from today ----------
  const WEATHER_LOCATIONS = [
    { name: 'Basel', lat: 47.5596, lon: 7.5886, elId: 'weatherBasel' },
    { name: 'Bozen', lat: 46.4983, lon: 11.3548, elId: 'weatherBozen' }
  ];

  function weatherIcon(code) {
    const map = {
      0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
      45: '🌫️', 48: '🌫️',
      51: '🌦️', 53: '🌦️', 55: '🌦️',
      56: '🌧️', 57: '🌧️',
      61: '🌧️', 63: '🌧️', 65: '🌧️',
      66: '🌨️', 67: '🌨️',
      71: '❄️', 73: '❄️', 75: '❄️', 77: '❄️',
      80: '🌦️', 81: '🌦️', 82: '⛈️',
      85: '🌨️', 86: '🌨️',
      95: '⛈️', 96: '⛈️', 99: '⛈️'
    };
    return map[code] || '🌡️';
  }

  // Converts a series of points into a smooth, organic-looking curve through all of
  // them (Catmull-Rom spline, expressed as cubic beziers), rather than straight
  // lines between points.
  function catmullRomPath(pts) {
    if (pts.length < 2) return '';
    if (pts.length === 2) {
      return 'M ' + pts[0][0] + ' ' + pts[0][1] + ' L ' + pts[1][0] + ' ' + pts[1][1];
    }
    let d = 'M ' + pts[0][0] + ' ' + pts[0][1];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2] || p2;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6;
      const c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6;
      const c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ' C ' + c1x + ' ' + c1y + ', ' + c2x + ' ' + c2y + ', ' + p2[0] + ' ' + p2[1];
    }
    return d;
  }

  // Builds an inline SVG temperature curve for the whole day. Temperature, weather icon
  // and hour label are all shown every 3 hours. The part of the day that has already
  // passed is shown grayed out.
  function buildHourlyChart(hourly, currentHour) {
    const sampleHours = [];
    for (let h = 0; h < 24; h += 3) sampleHours.push(h);
    const points = sampleHours.map(h => ({
      hour: h,
      temp: hourly.temperature_2m[h],
      code: hourly.weather_code[h]
    }));

    const W = 480, H = 220;
    const leftPad = 26, rightPad = 26;
    const chartTop = 64, chartBottom = 172;
    const temps = points.map(p => p.temp);
    const minT = Math.min(...temps);
    const maxT = Math.max(...temps);
    const range = Math.max(maxT - minT, 2);

    const xAt = hourVal => leftPad + (hourVal / 24) * (W - leftPad - rightPad);
    const yAt = t => chartTop + (chartBottom - chartTop) - ((t - minT) / range) * (chartBottom - chartTop);

    const boundaryIdx = Math.max(0, points.map(p => p.hour).filter(h => h <= currentHour).length - 1);
    const pastPts = points.slice(0, boundaryIdx + 1).map(p => [xAt(p.hour), yAt(p.temp)]);
    const futurePts = points.slice(boundaryIdx).map(p => [xAt(p.hour), yAt(p.temp)]);

    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';

    // "now" marker
    const nowX = xAt(currentHour);
    svg += '<line x1="' + nowX + '" y1="' + chartTop + '" x2="' + nowX + '" y2="' + chartBottom + '" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>';

    const pastPath = catmullRomPath(pastPts);
    const futurePath = catmullRomPath(futurePts);
    if (pastPath) svg += '<path d="' + pastPath + '" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>';
    if (futurePath) svg += '<path d="' + futurePath + '" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';

    points.forEach(p => {
      const isPast = p.hour < currentHour;
      const dotColor = isPast ? 'var(--muted)' : 'var(--accent)';
      const textColor = isPast ? 'var(--muted)' : 'var(--text)';
      const opacity = isPast ? 0.55 : 1;
      const x = xAt(p.hour), y = yAt(p.temp);

      svg += '<circle cx="' + x + '" cy="' + y + '" r="3.5" fill="' + dotColor + '" opacity="' + opacity + '"/>';
      svg += '<text x="' + x + '" y="' + (y - 12) + '" font-size="13" font-weight="600" text-anchor="middle" fill="' + textColor + '" opacity="' + opacity + '">' + Math.round(p.temp) + '°</text>';
      svg += '<text x="' + x + '" y="30" font-size="20" text-anchor="middle" opacity="' + opacity + '">' + weatherIcon(p.code) + '</text>';
      svg += '<text x="' + x + '" y="' + (H - 10) + '" font-size="12" text-anchor="middle" fill="var(--muted)" opacity="' + opacity + '">' + String(p.hour).padStart(2,'0') + ' Uhr</text>';
    });

    svg += '</svg>';
    return { html: svg, nowX: nowX };
  }

  async function loadWeather(loc) {
    const card = document.getElementById(loc.elId);
    const summaryEl = card.querySelector('.weather-summary');
    const detailsEl = card.querySelector('.weather-details');
    const toggleBtn = card.querySelector('.weather-toggle');

    try {
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat + '&longitude=' + loc.lon +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
        '&hourly=temperature_2m,weather_code&current_weather=true&timezone=auto&forecast_days=7';
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      // Always visible: current conditions + tomorrow's outlook
      const cw = data.current_weather;
      const nowIcon = weatherIcon(cw.weathercode);
      const nowTemp = Math.round(cw.temperature);
      const tMax = Math.round(data.daily.temperature_2m_max[1]);
      const tMin = Math.round(data.daily.temperature_2m_min[1]);
      const tIcon = weatherIcon(data.daily.weather_code[1]);
      summaryEl.innerHTML =
        '<div class="weather-day-row"><span class="wd">Jetzt</span>' +
          '<span class="icon">' + nowIcon + '</span>' +
          '<span class="temps">' + nowTemp + '°</span></div>' +
        '<div class="weather-day-row"><span class="wd">Morgen</span>' +
          '<span class="icon">' + tIcon + '</span>' +
          '<span class="temps">' + tMax + '°<span class="min">/' + tMin + '°</span></span></div>';

      // Expandable: temperature curve for the rest of today + the rest of the week
      const currentHour = parseInt(cw.time.slice(11, 13), 10);
      const chart = buildHourlyChart(data.hourly, currentHour);
      let detailsHtml = '<div class="weather-section-label">Heute im Verlauf</div>';
      detailsHtml += '<div class="weather-chart-hint">← zur Seite wischen/scrollen →</div>';
      detailsHtml += '<div class="weather-chart" data-nowx="' + chart.nowX + '">' + chart.html + '</div>';
      detailsHtml += '<div class="weather-section-label">Diese Woche</div>';
      const days = data.daily.time;
      for (let i = 1; i < days.length; i++) {
        const d = new Date(days[i] + 'T12:00:00');
        const wd = d.toLocaleDateString('de-DE', { weekday: 'short' });
        const code = data.daily.weather_code[i];
        const max = Math.round(data.daily.temperature_2m_max[i]);
        const min = Math.round(data.daily.temperature_2m_min[i]);
        detailsHtml += '<div class="weather-day-row"><span class="wd">' + wd + '</span>' +
          '<span class="icon">' + weatherIcon(code) + '</span>' +
          '<span class="temps">' + max + '°<span class="min">/' + min + '°</span></span></div>';
      }
      detailsEl.innerHTML = detailsHtml;

      toggleBtn.addEventListener('click', () => {
        const isOpen = detailsEl.style.display !== 'none';
        detailsEl.style.display = isOpen ? 'none' : 'block';
        toggleBtn.textContent = isOpen ? '▼ Mehr anzeigen' : '▲ Weniger anzeigen';
        if (!isOpen) {
          // center the chart on the current hour (only has a visible effect where it scrolls, i.e. on narrow screens)
          requestAnimationFrame(() => {
            const chartContainer = detailsEl.querySelector('.weather-chart');
            const nowX = parseFloat(chartContainer.dataset.nowx || '0');
            chartContainer.scrollLeft = Math.max(0, nowX - chartContainer.clientWidth / 2);
          });
        }
      });
    } catch (err) {
      console.error('Wetter konnte nicht geladen werden:', err);
      summaryEl.innerHTML = '<div style="color:var(--muted); font-size:0.85rem;">Wetter nicht verfügbar</div>';
      toggleBtn.style.display = 'none';
    }
  }

  WEATHER_LOCATIONS.forEach(loadWeather);

  // ---------- Init ----------
  renderTabs();
  renderDay();
})();
</script>
