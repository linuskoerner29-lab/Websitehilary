<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urlaubsplan</title>
<style>
  :root {
    --accent: #2a7f6e;
    --accent-light: #e4f3f0;
    --bg: #f7f7f5;
    --card-bg: #ffffff;
    --text: #222;
    --muted: #767676;
    --border: #e0e0e0;
    --today: #d98c2b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 6px 16px;
  }
  .header-top h1 {
    font-size: 1.3rem;
    margin: 0;
  }
  #adminBtn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  #adminBtn:hover { opacity: 0.9; }

  .tabs {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 6px 12px 12px 12px;
    scrollbar-width: thin;
  }
  .tab {
    flex: 0 0 auto;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fafafa;
    cursor: pointer;
    text-align: center;
    min-width: 66px;
    position: relative;
    transition: background 0.15s, color 0.15s;
  }
  .tab .wd { display: block; font-size: 0.72rem; color: var(--muted); }
  .tab .dt { display: block; font-weight: 600; font-size: 0.95rem; }
  .tab.today { border-color: var(--today); }
  .tab.today::after {
    content: "heute";
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--today);
    color: white;
    font-size: 0.6rem;
    padding: 1px 6px;
    border-radius: 999px;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
  }
  .tab.active .wd, .tab.active .dt { color: white; }

  main {
    max-width: 720px;
    margin: 20px auto;
    padding: 0 16px 60px 16px;
  }
  .day-heading {
    margin: 4px 0 16px 0;
  }
  .day-heading h2 {
    margin: 0;
    font-size: 1.4rem;
  }
  .day-heading .sub {
    color: var(--muted);
    font-size: 0.9rem;
  }

  .event {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    position: relative;
  }
  .event.highlight {
    border-color: var(--accent);
    background: var(--accent-light);
  }
  .event .time {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
  }
  .event h3 {
    margin: 4px 0 6px 0;
    font-size: 1.05rem;
  }
  .event p {
    margin: 0;
    font-size: 0.9rem;
    color: #444;
  }
  .star {
    position: absolute;
    top: 12px;
    right: 14px;
    font-size: 1rem;
  }
  .empty-note {
    color: var(--muted);
    font-style: italic;
    padding: 20px 0;
    text-align: center;
  }

  /* Modal */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: white;
    border-radius: 10px;
    padding: 20px;
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h2 { margin-top: 0; font-size: 1.2rem; }
  .modal input[type="password"], .modal input[type="text"], .modal input[type="datetime-local"], .modal textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    margin-top: 4px;
    margin-bottom: 10px;
    font-family: inherit;
  }
  .modal textarea { min-height: 60px; resize: vertical; }
  .modal label { font-size: 0.82rem; font-weight: 600; color: #444; }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 10px;
  }
  .btn {
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 0.88rem;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: #eee; color: #333; }
  .btn-danger { background: #c0392b; color: white; }
  .error-msg { color: #c0392b; font-size: 0.85rem; margin-top: -4px; margin-bottom: 8px; }

  .admin-daypicker {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .admin-daypicker button {
    padding: 5px 8px;
    font-size: 0.78rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fafafa;
    cursor: pointer;
  }
  .admin-daypicker button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .admin-event {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    background: #fafafa;
  }
  .admin-event .row {
    display: flex;
    gap: 8px;
  }
  .admin-event .row > div { flex: 1; }
  .admin-event .checkbox-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .admin-event .lock-note {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .admin-note {
    font-size: 0.8rem;
    color: var(--muted);
    background: #fff9ec;
    border: 1px solid #f0e0b0;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 14px;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1 id="tripTitle">Urlaub</h1>
    <button id="adminBtn">Admin</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div class="day-heading">
    <h2 id="dayTitle"></h2>
    <div class="sub" id="daySub"></div>
  </div>
  <div id="eventList"></div>
</main>

<!-- Password modal -->
<div class="modal-backdrop" id="pwBackdrop">
  <div class="modal">
    <h2>Admin-Zugang</h2>
    <label for="pwInput">Passwort</label>
    <input type="password" id="pwInput" placeholder="Passwort eingeben">
    <div class="error-msg" id="pwError" style="display:none;">Falsches Passwort.</div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="pwCancel">Abbrechen</button>
      <button class="btn btn-primary" id="pwSubmit">Bestätigen</button>
    </div>
  </div>
</div>

<!-- Admin modal -->
<div class="modal-backdrop" id="adminBackdrop">
  <div class="modal" style="max-width:600px;">
    <h2>Admin-Bereich</h2>
    <div class="admin-note">
      Hinweis (Prototyp): Änderungen werden nur in diesem Browser gespeichert (localStorage), nicht serverseitig geteilt.
    </div>
    <div class="admin-daypicker" id="adminDaypicker"></div>
    <div id="adminEventList"></div>
    <button class="btn btn-secondary" id="addEventBtn" style="margin-bottom:14px;">+ Event hinzufügen</button>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="adminClose">Schließen</button>
      <button class="btn btn-primary" id="adminSave">Speichern</button>
    </div>
  </div>
</div>

<script>
(function() {
  const TRIP_START = "2026-10-08";
  const TRIP_END = "2026-10-16";
  const ADMIN_PASSWORD = "Basel123";
  const STORAGE_KEY = "urlaub_prototyp_data_v1";

  // ---------- Date helpers ----------
  function dateRange(startStr, endStr) {
    const dates = [];
    let d = new Date(startStr + "T00:00:00");
    const end = new Date(endStr + "T00:00:00");
    while (d <= end) {
      dates.push(d.toISOString().slice(0, 10));
      d.setDate(d.getDate() + 1);
    }
    return dates;
  }

  function formatDayLabel(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const weekday = d.toLocaleDateString('de-DE', { weekday: 'short' });
    const dm = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
    return { weekday, dm };
  }

  function formatDayHeading(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const weekday = d.toLocaleDateString('de-DE', { weekday: 'long' });
    const full = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
    return weekday + ", " + full + ".";
  }

  function todayStr() {
    const n = new Date();
    return n.getFullYear() + "-" + String(n.getMonth()+1).padStart(2,'0') + "-" + String(n.getDate()).padStart(2,'0');
  }

  const ALL_DATES = dateRange(TRIP_START, TRIP_END);

  // ---------- Default seed data ----------
  function defaultData() {
    const data = {};
    ALL_DATES.forEach((date, i) => {
      data[date] = { events: [] };
    });
    // A few example entries to show how it works
    data[ALL_DATES[0]].events.push({
      id: cryptoId(), time: "14:00", title: "Ankunft & Check-in",
      description: "Ankunft am Zielort, Check-in in der Unterkunft, kurz ausruhen.",
      highlight: false, visibleFrom: null
    });
    data[ALL_DATES[0]].events.push({
      id: cryptoId(), time: "19:00", title: "Begrüßungsessen",
      description: "Gemeinsames Abendessen in der Altstadt.",
      highlight: true, visibleFrom: null
    });
    data[ALL_DATES[2]].events.push({
      id: cryptoId(), time: "10:00", title: "Geheime Überraschung",
      description: "Wird erst kurz vorher sichtbar – Beispiel für zeitgesteuerte Anzeige.",
      highlight: true, visibleFrom: addDaysISO(ALL_DATES[2], -1)
    });
    data[ALL_DATES[4]].events.push({
      id: cryptoId(), time: "09:00", title: "Wanderung",
      description: "Ganztägige Wanderung mit Picknick.",
      highlight: true, visibleFrom: null
    });
    return data;
  }

  function addDaysISO(dateStr, days) {
    const d = new Date(dateStr + "T09:00:00");
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0,16);
  }

  function cryptoId() {
    return 'e' + Math.random().toString(36).slice(2, 10);
  }

  // ---------- State ----------
  let tripData = loadData();
  let selectedDate = ALL_DATES.includes(todayStr())
    ? todayStr()
    : (todayStr() < ALL_DATES[0] ? ALL_DATES[0] : ALL_DATES[ALL_DATES.length - 1]);
  let adminSelectedDate = selectedDate;
  let isAdmin = false;

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return defaultData();
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tripData));
    } catch (e) {}
  }

  // ---------- Rendering: Tabs ----------
  const tabsEl = document.getElementById('tabs');
  function renderTabs() {
    tabsEl.innerHTML = '';
    const today = todayStr();
    ALL_DATES.forEach(date => {
      const { weekday, dm } = formatDayLabel(date);
      const btn = document.createElement('div');
      btn.className = 'tab' + (date === selectedDate ? ' active' : '') + (date === today ? ' today' : '');
      btn.innerHTML = '<span class="wd">' + weekday + '</span><span class="dt">' + dm + '</span>';
      btn.addEventListener('click', () => {
        selectedDate = date;
        renderTabs();
        renderDay();
      });
      tabsEl.appendChild(btn);
    });
  }

  // ---------- Rendering: Day content ----------
  const dayTitleEl = document.getElementById('dayTitle');
  const daySubEl = document.getElementById('daySub');
  const eventListEl = document.getElementById('eventList');

  function renderDay() {
    dayTitleEl.textContent = formatDayHeading(selectedDate);
    const idx = ALL_DATES.indexOf(selectedDate) + 1;
    daySubEl.textContent = 'Tag ' + idx + ' von ' + ALL_DATES.length;

    const now = new Date();
    const events = (tripData[selectedDate] && tripData[selectedDate].events) || [];
    const visibleEvents = events.filter(ev => isVisible(ev, now));
    visibleEvents.sort((a,b) => (a.time||'').localeCompare(b.time||''));

    eventListEl.innerHTML = '';
    if (visibleEvents.length === 0) {
      eventListEl.innerHTML = '<div class="empty-note">Für diesen Tag ist noch nichts geplant.</div>';
      return;
    }
    visibleEvents.forEach(ev => {
      const div = document.createElement('div');
      div.className = 'event' + (ev.highlight ? ' highlight' : '');
      div.innerHTML =
        (ev.highlight ? '<span class="star">⭐</span>' : '') +
        '<div class="time">' + (ev.time || '') + '</div>' +
        '<h3>' + escapeHtml(ev.title) + '</h3>' +
        '<p>' + escapeHtml(ev.description) + '</p>';
      eventListEl.appendChild(div);
    });
  }

  function isVisible(ev, now) {
    if (!ev.visibleFrom) return true;
    const vf = new Date(ev.visibleFrom);
    return now >= vf;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  // ---------- Admin: password modal ----------
  const adminBtn = document.getElementById('adminBtn');
  const pwBackdrop = document.getElementById('pwBackdrop');
  const pwInput = document.getElementById('pwInput');
  const pwError = document.getElementById('pwError');
  const pwSubmit = document.getElementById('pwSubmit');
  const pwCancel = document.getElementById('pwCancel');

  adminBtn.addEventListener('click', () => {
    pwInput.value = '';
    pwError.style.display = 'none';
    pwBackdrop.classList.add('open');
    pwInput.focus();
  });
  pwCancel.addEventListener('click', () => pwBackdrop.classList.remove('open'));
  pwSubmit.addEventListener('click', tryLogin);
  pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });

  function tryLogin() {
    if (pwInput.value === ADMIN_PASSWORD) {
      isAdmin = true;
      pwBackdrop.classList.remove('open');
      adminSelectedDate = selectedDate;
      openAdmin();
    } else {
      pwError.style.display = 'block';
    }
  }

  // ---------- Admin panel ----------
  const adminBackdrop = document.getElementById('adminBackdrop');
  const adminDaypicker = document.getElementById('adminDaypicker');
  const adminEventList = document.getElementById('adminEventList');
  const addEventBtn = document.getElementById('addEventBtn');
  const adminClose = document.getElementById('adminClose');
  const adminSave = document.getElementById('adminSave');

  function openAdmin() {
    renderAdminDaypicker();
    renderAdminEvents();
    adminBackdrop.classList.add('open');
  }

  function renderAdminDaypicker() {
    adminDaypicker.innerHTML = '';
    ALL_DATES.forEach(date => {
      const { weekday, dm } = formatDayLabel(date);
      const b = document.createElement('button');
      b.textContent = weekday + ' ' + dm;
      b.className = date === adminSelectedDate ? 'active' : '';
      b.addEventListener('click', () => {
        adminSelectedDate = date;
        renderAdminDaypicker();
        renderAdminEvents();
      });
      adminDaypicker.appendChild(b);
    });
  }

  function renderAdminEvents() {
    adminEventList.innerHTML = '';
    const events = (tripData[adminSelectedDate] && tripData[adminSelectedDate].events) || [];
    if (events.length === 0) {
      const p = document.createElement('div');
      p.className = 'empty-note';
      p.textContent = 'Noch keine Events für diesen Tag.';
      adminEventList.appendChild(p);
    }
    events.forEach(ev => {
      adminEventList.appendChild(buildAdminEventRow(ev));
    });
  }

  function buildAdminEventRow(ev) {
    const wrap = document.createElement('div');
    wrap.className = 'admin-event';

    const lockNote = ev.visibleFrom
      ? '<div class="lock-note">🔒 Für Gäste erst sichtbar ab: ' + new Date(ev.visibleFrom).toLocaleString('de-DE') + '</div>'
      : '<div class="lock-note">👁️ Für Gäste jederzeit sichtbar</div>';

    wrap.innerHTML =
      lockNote +
      '<div class="row">' +
        '<div style="flex:0 0 100px;"><label>Uhrzeit</label><input type="text" class="f-time" placeholder="14:00" value="' + escapeAttr(ev.time) + '"></div>' +
        '<div><label>Titel</label><input type="text" class="f-title" value="' + escapeAttr(ev.title) + '"></div>' +
      '</div>' +
      '<label>Beschreibung</label>' +
      '<textarea class="f-desc">' + escapeHtml(ev.description) + '</textarea>' +
      '<div class="checkbox-row"><input type="checkbox" class="f-highlight" ' + (ev.highlight ? 'checked' : '') + '> Als Highlight markieren</div>' +
      '<label>Sichtbar für Gäste ab (leer lassen = immer sichtbar)</label>' +
      '<input type="datetime-local" class="f-visible" value="' + (ev.visibleFrom ? ev.visibleFrom.slice(0,16) : '') + '">' +
      '<div class="modal-actions"><button class="btn btn-danger f-delete">Löschen</button></div>';

    // bind live edits to the in-memory object
    wrap.querySelector('.f-time').addEventListener('input', e => ev.time = e.target.value);
    wrap.querySelector('.f-title').addEventListener('input', e => ev.title = e.target.value);
    wrap.querySelector('.f-desc').addEventListener('input', e => ev.description = e.target.value);
    wrap.querySelector('.f-highlight').addEventListener('change', e => ev.highlight = e.target.checked);
    wrap.querySelector('.f-visible').addEventListener('input', e => {
      ev.visibleFrom = e.target.value ? e.target.value : null;
      wrap.querySelector('.lock-note').outerHTML = ev.visibleFrom
        ? '<div class="lock-note">🔒 Für Gäste erst sichtbar ab: ' + new Date(ev.visibleFrom).toLocaleString('de-DE') + '</div>'
        : '<div class="lock-note">👁️ Für Gäste jederzeit sichtbar</div>';
    });
    wrap.querySelector('.f-delete').addEventListener('click', () => {
      const list = tripData[adminSelectedDate].events;
      const i = list.findIndex(x => x.id === ev.id);
      if (i > -1) list.splice(i, 1);
      renderAdminEvents();
    });

    return wrap;
  }

  function escapeAttr(str) {
    return (str || '').replace(/"/g, '&quot;');
  }

  addEventBtn.addEventListener('click', () => {
    if (!tripData[adminSelectedDate]) tripData[adminSelectedDate] = { events: [] };
    tripData[adminSelectedDate].events.push({
      id: cryptoId(), time: '', title: 'Neues Event', description: '', highlight: false, visibleFrom: null
    });
    renderAdminEvents();
  });

  adminClose.addEventListener('click', () => {
    adminBackdrop.classList.remove('open');
    tripData = loadData(); // discard unsaved in-memory edits
    renderDay();
  });

  adminSave.addEventListener('click', () => {
    saveData();
    adminBackdrop.classList.remove('open');
    renderDay();
  });

  // ---------- Init ----------
  renderTabs();
  renderDay();
})();
</script>
</body>
</html>
