<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urlaubsplan</title>
<style>
  :root {
    --accent: #2a7f6e;
    --accent-light: #e4f3f0;
    --bg: #f7f7f5;
    --card-bg: #ffffff;
    --text: #222;
    --muted: #767676;
    --border: #e0e0e0;
    --today: #d98c2b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 6px 16px;
  }
  .header-top h1 {
    font-size: 1.3rem;
    margin: 0;
  }
  #adminBtn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  #adminBtn:hover { opacity: 0.9; }

  .tabs {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 6px 12px 12px 12px;
    scrollbar-width: thin;
  }
  .tab {
    flex: 0 0 auto;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fafafa;
    cursor: pointer;
    text-align: center;
    min-width: 66px;
    position: relative;
    transition: background 0.15s, color 0.15s;
  }
  .tab .wd { display: block; font-size: 0.72rem; color: var(--muted); }
  .tab .dt { display: block; font-weight: 600; font-size: 0.95rem; }
  .tab.today { border-color: var(--today); }
  .tab.today::after {
    content: "heute";
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--today);
    color: white;
    font-size: 0.6rem;
    padding: 1px 6px;
    border-radius: 999px;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
  }
  .tab.active .wd, .tab.active .dt { color: white; }

  .page-layout {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    align-items: flex-start;
    gap: 4px;
  }
  main {
    max-width: 720px;
    flex: 1;
    min-width: 0;
    margin: 20px auto;
    padding: 0 16px 60px 16px;
  }
  .weather-panel {
    width: 220px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 20px;
    padding-left: 16px;
  }
  .weather-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .weather-card h4 {
    margin: 0 0 8px 0;
    font-size: 0.88rem;
  }
  .weather-day-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.8rem;
    padding: 3px 0;
  }
  .weather-day-row .wd {
    color: var(--muted);
    width: 28px;
  }
  .weather-day-row .icon { font-size: 1rem; }
  .weather-day-row .temps { font-weight: 600; }
  .weather-day-row .temps .min {
    color: var(--muted);
    font-weight: 400;
    margin-left: 3px;
  }
  @media (max-width: 800px) {
    .page-layout { flex-direction: column; }
    .weather-panel {
      width: 100%;
      flex-direction: row;
      flex-wrap: wrap;
      padding-left: 0;
      margin-top: 12px;
    }
    .weather-card { flex: 1; min-width: 150px; }
    main { margin: 0 auto; }
  }
  .day-heading {
    margin: 4px 0 16px 0;
  }
  .day-heading h2 {
    margin: 0;
    font-size: 1.4rem;
  }
  .day-heading .sub {
    color: var(--muted);
    font-size: 0.9rem;
  }

  .event {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    position: relative;
  }
  .event.highlight {
    border-color: var(--accent);
    background: var(--accent-light);
  }
  .event .time {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
  }
  .event h3 {
    margin: 4px 0 6px 0;
    font-size: 1.05rem;
  }
  .event p {
    margin: 0;
    font-size: 0.9rem;
    color: #444;
  }
  .event .rich-content {
    font-size: 0.9rem;
    color: #444;
    margin-bottom: 4px;
  }
  .event .rich-content p { margin: 0 0 6px 0; }
  .star {
    position: absolute;
    top: 12px;
    right: 14px;
    font-size: 1rem;
  }
  .event .links {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .event .links a {
    display: inline-block;
    font-size: 0.8rem;
    text-decoration: none;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .event .links a:hover { background: var(--accent-light); }
  .event .photos {
    margin-top: 10px;
    display: flex;
    gap: 8px;
  }
  .event .photos img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: block;
    cursor: pointer;
  }

  /* Lightbox */
  .lightbox-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .lightbox-backdrop.open { display: flex; }
  .lightbox-backdrop img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 6px;
  }
  .lightbox-close, .lightbox-prev, .lightbox-next {
    position: absolute;
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    font-size: 1.6rem;
    cursor: pointer;
    border-radius: 50%;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover { background: rgba(255,255,255,0.3); }
  .lightbox-close { top: 16px; right: 16px; }
  .lightbox-prev { left: 16px; top: 50%; transform: translateY(-50%); }
  .lightbox-next { right: 16px; top: 50%; transform: translateY(-50%); }
  .lightbox-counter {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 0.85rem;
    background: rgba(0,0,0,0.4);
    padding: 3px 10px;
    border-radius: 999px;
  }
  @media (max-width: 600px) {
    .lightbox-prev, .lightbox-next, .lightbox-close {
      width: 40px; height: 40px; font-size: 1.3rem;
    }
  }
  .empty-note {
    color: var(--muted);
    font-style: italic;
    padding: 20px 0;
    text-align: center;
  }

  /* Modal */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: white;
    border-radius: 10px;
    padding: 20px;
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h2 { margin-top: 0; font-size: 1.2rem; }
  .modal input[type="password"], .modal input[type="text"], .modal input[type="datetime-local"], .modal textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    margin-top: 4px;
    margin-bottom: 10px;
    font-family: inherit;
  }
  .modal textarea { min-height: 60px; resize: vertical; }
  .modal label { font-size: 0.82rem; font-weight: 600; color: #444; }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 10px;
  }
  .btn {
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 0.88rem;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: #eee; color: #333; }
  .btn-danger { background: #c0392b; color: white; }
  .error-msg { color: #c0392b; font-size: 0.85rem; margin-top: -4px; margin-bottom: 8px; }

  .admin-daypicker {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .admin-daypicker button {
    padding: 5px 8px;
    font-size: 0.78rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fafafa;
    cursor: pointer;
  }
  .admin-daypicker button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .admin-event {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    background: #fafafa;
  }
  .admin-event .row {
    display: flex;
    gap: 8px;
  }
  .admin-event .row > div { flex: 1; }
  .admin-event .checkbox-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .admin-event .lock-note {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .admin-note {
    font-size: 0.8rem;
    color: var(--muted);
    background: #fff9ec;
    border: 1px solid #f0e0b0;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 14px;
  }

  .template-badge {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    background: var(--accent-light);
    color: var(--accent);
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .fields-container {
    margin: 10px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .field-row {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    background: white;
  }
  .field-row-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .field-label {
    font-size: 0.78rem;
    font-weight: 600;
    color: #555;
  }
  .field-remove {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 2px 6px;
  }
  .field-remove:hover { color: #c0392b; }
  .field-row input[type="text"] { margin-bottom: 0; }
  .add-field-row, .add-event-templates {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: 10px 0 16px 0;
  }
  .btn-add-field, .btn-add-template {
    font-size: 0.78rem;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px dashed var(--accent);
    background: white;
    color: var(--accent);
    cursor: pointer;
  }
  .btn-add-field:hover, .btn-add-template:hover { background: var(--accent-light); }

  .rte-toolbar {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
  }
  .rte-toolbar button {
    width: 28px;
    height: 26px;
    border: 1px solid var(--border);
    background: #fafafa;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.82rem;
  }
  .rte-toolbar button:hover { background: #eee; }
  .rte-toolbar select {
    font-size: 0.78rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 4px;
  }
  .rte-box {
    min-height: 60px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font-size: 0.9rem;
    outline: none;
  }
  .rte-box:focus { border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1 id="tripTitle">Urlaub</h1>
    <button id="adminBtn">Admin</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="page-layout">
  <aside class="weather-panel" id="weatherPanel">
    <div class="weather-card" id="weatherBasel">
      <h4>📍 Basel</h4>
      <div class="weather-days">Lädt…</div>
    </div>
    <div class="weather-card" id="weatherBozen">
      <h4>📍 Bozen</h4>
      <div class="weather-days">Lädt…</div>
    </div>
  </aside>

  <main>
    <div class="day-heading">
      <h2 id="dayTitle"></h2>
      <div class="sub" id="daySub"></div>
    </div>
    <div id="eventList"></div>
  </main>
</div>

<!-- Lightbox for viewing images full-size -->
<div class="lightbox-backdrop" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <button class="lightbox-prev" id="lightboxPrev">‹</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-next" id="lightboxNext">›</button>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<!-- Password modal -->
<div class="modal-backdrop" id="pwBackdrop">
  <div class="modal">
    <h2>Admin-Zugang</h2>
    <label for="pwInput">Passwort</label>
    <input type="password" id="pwInput" placeholder="Passwort eingeben">
    <div class="error-msg" id="pwError" style="display:none;">Falsches Passwort.</div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="pwCancel">Abbrechen</button>
      <button class="btn btn-primary" id="pwSubmit">Bestätigen</button>
    </div>
  </div>
</div>

<!-- Admin modal -->
<div class="modal-backdrop" id="adminBackdrop">
  <div class="modal" style="max-width:600px;">
    <h2>Admin-Bereich</h2>
    <div class="admin-note">
      Änderungen werden in der gemeinsamen Datenbank gespeichert und sind für alle Besucher der Seite sichtbar.
    </div>
    <div class="admin-note" id="syncStatus">Verbindung wird hergestellt…</div>
    <div class="admin-daypicker" id="adminDaypicker"></div>
    <div id="adminEventList"></div>
    <label>Neues Event anlegen aus Vorlage</label>
    <div class="add-event-templates" id="addEventTemplates"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="adminClose">Schließen</button>
      <button class="btn btn-primary" id="adminSave">Speichern</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAAPzLz1bAf1CXTIBl7myYheDGx5AnqjMM",
  authDomain: "hilaryeurope.firebaseapp.com",
  projectId: "hilaryeurope",
  storageBucket: "hilaryeurope.firebasestorage.app",
  messagingSenderId: "335576706334",
  appId: "1:335576706334:web:f66b291e056caca078ad0f"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
const tripDocRef = doc(db, "trip", "main");
const ADMIN_EMAIL = "hilary@europe2026.com";

(function() {
  const TRIP_START = "2026-10-08";
  const TRIP_END = "2026-10-16";

  // ---------- Date helpers ----------
  function dateRange(startStr, endStr) {
    const dates = [];
    let d = new Date(startStr + "T00:00:00");
    const end = new Date(endStr + "T00:00:00");
    while (d <= end) {
      dates.push(d.toISOString().slice(0, 10));
      d.setDate(d.getDate() + 1);
    }
    return dates;
  }

  function formatDayLabel(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const weekday = d.toLocaleDateString('de-DE', { weekday: 'short' });
    const dm = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
    return { weekday, dm };
  }

  function formatDayHeading(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const weekday = d.toLocaleDateString('de-DE', { weekday: 'long' });
    const full = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
    return weekday + ", " + full + ".";
  }

  function todayStr() {
    const n = new Date();
    return n.getFullYear() + "-" + String(n.getMonth()+1).padStart(2,'0') + "-" + String(n.getDate()).padStart(2,'0');
  }

  const ALL_DATES = dateRange(TRIP_START, TRIP_END);

  // ---------- Field types & templates ----------
  const FIELD_TYPE_INFO = {
    time:     { label: 'Uhrzeit', icon: '⏰' },
    image:    { label: 'Bild',    icon: '🖼️' },
    link:     { label: 'Link',    icon: '🔗' },
    richtext: { label: 'Text',    icon: '📝' }
  };

  function mkField(type, value) {
    return { id: cryptoId(), type, value: value || '' };
  }

  const TEMPLATES = {
    aktivitaet: {
      label: 'Aktivität', icon: '🏃',
      build: () => [ mkField('time'), mkField('richtext'), mkField('link'), mkField('image'), mkField('image') ]
    },
    viewpoint: {
      label: 'Viewpoint', icon: '📷',
      build: () => [ mkField('image'), mkField('image') ]
    },
    frei: {
      label: 'Frei', icon: '✏️',
      build: () => [ mkField('richtext') ]
    }
  };

  // Converts events saved in the old (pre-template) format into the new field-based format,
  // so nothing already stored in the database gets lost.
  function migrateEvent(ev) {
    if (Array.isArray(ev.fields)) return ev;
    const fields = [];
    if (ev.time) fields.push(mkField('time', ev.time));
    if (ev.description) fields.push(mkField('richtext', '<p>' + escapeHtml(ev.description) + '</p>'));
    if (ev.mapsLink) fields.push(mkField('link', ev.mapsLink));
    if (ev.website) fields.push(mkField('link', ev.website));
    (ev.images || []).forEach(url => { if (url) fields.push(mkField('image', url)); });
    return {
      id: ev.id || cryptoId(),
      templateType: 'frei',
      title: ev.title || '',
      highlight: !!ev.highlight,
      visibleFrom: ev.visibleFrom || null,
      fields
    };
  }

  function getTimeValue(ev) {
    const f = (ev.fields || []).find(f => f.type === 'time');
    return f ? f.value : '';
  }

  // ---------- Default seed data ----------
  function defaultData() {
    const data = {};
    ALL_DATES.forEach((date, i) => {
      data[date] = { events: [] };
    });
    // A few example entries to show how it works
    data[ALL_DATES[0]].events.push({
      id: cryptoId(), templateType: 'aktivitaet', title: 'Ankunft & Check-in',
      highlight: false, visibleFrom: null,
      fields: [
        mkField('time', '14:00'),
        mkField('richtext', '<p>Ankunft am Zielort, Check-in in der Unterkunft, kurz ausruhen.</p>')
      ]
    });
    data[ALL_DATES[0]].events.push({
      id: cryptoId(), templateType: 'aktivitaet', title: 'Begrüßungsessen',
      highlight: true, visibleFrom: null,
      fields: [
        mkField('time', '19:00'),
        mkField('richtext', '<p>Gemeinsames <strong>Abendessen</strong> in der Altstadt.</p>'),
        mkField('link', 'https://maps.app.goo.gl/beispiel'),
        mkField('image'), mkField('image')
      ]
    });
    data[ALL_DATES[2]].events.push({
      id: cryptoId(), templateType: 'aktivitaet', title: 'Geheime Überraschung',
      highlight: true, visibleFrom: addDaysISO(ALL_DATES[2], -1),
      fields: [
        mkField('time', '10:00'),
        mkField('richtext', '<p>Wird erst kurz vorher sichtbar – Beispiel für zeitgesteuerte Anzeige.</p>')
      ]
    });
    data[ALL_DATES[4]].events.push({
      id: cryptoId(), templateType: 'aktivitaet', title: 'Wanderung',
      highlight: true, visibleFrom: null,
      fields: [
        mkField('time', '09:00'),
        mkField('richtext', '<p>Ganztägige Wanderung mit Picknick.</p>')
      ]
    });
    data[ALL_DATES[4]].events.push({
      id: cryptoId(), templateType: 'viewpoint', title: 'Aussichtspunkt',
      highlight: false, visibleFrom: null,
      fields: [ mkField('image'), mkField('image') ]
    });
    return data;
  }

  function addDaysISO(dateStr, days) {
    const d = new Date(dateStr + "T09:00:00");
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0,16);
  }

  function cryptoId() {
    return 'e' + Math.random().toString(36).slice(2, 10);
  }

  // ---------- State ----------
  let tripData = defaultData(); // placeholder until Firebase responds
  let lastSyncedData = null;
  let selectedDate = ALL_DATES.includes(todayStr())
    ? todayStr()
    : (todayStr() < ALL_DATES[0] ? ALL_DATES[0] : ALL_DATES[ALL_DATES.length - 1]);
  let adminSelectedDate = selectedDate;
  let isAdmin = false;

  const syncStatusEl = document.getElementById('syncStatus');

  // Live sync: every visitor's page updates automatically when the admin saves
  onSnapshot(tripDocRef, (snap) => {
    if (snap.exists()) {
      tripData = snap.data();
      // migrate any events still in the old format (keeps older saved data working)
      Object.keys(tripData).forEach(date => {
        const day = tripData[date];
        if (day && Array.isArray(day.events)) {
          day.events = day.events.map(migrateEvent);
        }
      });
    } else {
      // first ever run: seed the database with the example data
      tripData = defaultData();
      setDoc(tripDocRef, tripData).catch(err => console.error('Seed write failed', err));
    }
    lastSyncedData = JSON.parse(JSON.stringify(tripData));
    if (syncStatusEl) {
      syncStatusEl.textContent = 'Verbunden – Änderungen werden geteilt.';
    }
    renderDay();
    if (adminBackdrop.classList.contains('open')) {
      renderAdminEvents();
    }
  }, (err) => {
    console.error(err);
    if (syncStatusEl) syncStatusEl.textContent = 'Verbindung fehlgeschlagen – bitte neu laden.';
  });

  function saveData() {
    return setDoc(tripDocRef, tripData);
  }

  // ---------- Rendering: Tabs ----------
  const tabsEl = document.getElementById('tabs');
  function renderTabs() {
    tabsEl.innerHTML = '';
    const today = todayStr();
    ALL_DATES.forEach(date => {
      const { weekday, dm } = formatDayLabel(date);
      const btn = document.createElement('div');
      btn.className = 'tab' + (date === selectedDate ? ' active' : '') + (date === today ? ' today' : '');
      btn.innerHTML = '<span class="wd">' + weekday + '</span><span class="dt">' + dm + '</span>';
      btn.addEventListener('click', () => {
        selectedDate = date;
        renderTabs();
        renderDay();
      });
      tabsEl.appendChild(btn);
    });
  }

  // ---------- Rendering: Day content ----------
  const dayTitleEl = document.getElementById('dayTitle');
  const daySubEl = document.getElementById('daySub');
  const eventListEl = document.getElementById('eventList');

  function renderDay() {
    dayTitleEl.textContent = formatDayHeading(selectedDate);
    const idx = ALL_DATES.indexOf(selectedDate) + 1;
    daySubEl.textContent = 'Tag ' + idx + ' von ' + ALL_DATES.length;

    const now = new Date();
    const events = (tripData[selectedDate] && tripData[selectedDate].events) || [];
    const visibleEvents = events.filter(ev => isVisible(ev, now));
    visibleEvents.sort((a,b) => (getTimeValue(a)||'').localeCompare(getTimeValue(b)||''));

    eventListEl.innerHTML = '';
    if (visibleEvents.length === 0) {
      eventListEl.innerHTML = '<div class="empty-note">Für diesen Tag ist noch nichts geplant.</div>';
      return;
    }
    visibleEvents.forEach(ev => {
      const div = document.createElement('div');
      div.className = 'event' + (ev.highlight ? ' highlight' : '');
      const fields = ev.fields || [];
      const timeVal = getTimeValue(ev);
      const richtexts = fields.filter(f => f.type === 'richtext' && f.value);
      const links = fields.filter(f => f.type === 'link' && f.value);
      const images = fields.filter(f => f.type === 'image' && f.value);

      let html =
        (ev.highlight ? '<span class="star">⭐</span>' : '') +
        (timeVal ? '<div class="time">' + escapeHtml(timeVal) + '</div>' : '') +
        '<h3>' + escapeHtml(ev.title) + '</h3>';

      richtexts.forEach(f => {
        html += '<div class="rich-content">' + f.value + '</div>';
      });

      if (links.length) {
        html += '<div class="links">' + links.map(f =>
          '<a href="' + escapeAttr(f.value) + '" target="_blank" rel="noopener">🔗 Link öffnen</a>'
        ).join('') + '</div>';
      }

      if (images.length) {
        html += '<div class="photos">' + images.map((f, idx) =>
          '<img class="photo-thumb" data-idx="' + idx + '" src="' + escapeAttr(f.value) + '" alt="' + escapeAttr(ev.title) + '" loading="lazy">'
        ).join('') + '</div>';
      }

      div.innerHTML = html;
      eventListEl.appendChild(div);

      if (images.length) {
        const urls = images.map(f => f.value);
        div.querySelectorAll('.photo-thumb').forEach(thumb => {
          thumb.addEventListener('click', () => openLightbox(urls, parseInt(thumb.dataset.idx, 10)));
        });
      }
    });
  }

  // ---------- Lightbox (view images full-size, navigate with arrows) ----------
  const lightboxEl = document.getElementById('lightbox');
  const lightboxImgEl = document.getElementById('lightboxImg');
  const lightboxCounterEl = document.getElementById('lightboxCounter');
  const lightboxPrevBtn = document.getElementById('lightboxPrev');
  const lightboxNextBtn = document.getElementById('lightboxNext');
  const lightboxCloseBtn = document.getElementById('lightboxClose');
  let lightboxImages = [];
  let lightboxIndex = 0;

  function openLightbox(urls, index) {
    lightboxImages = urls;
    lightboxIndex = index;
    showLightboxImage();
    lightboxEl.classList.add('open');
  }

  function closeLightbox() {
    lightboxEl.classList.remove('open');
  }

  function showLightboxImage() {
    lightboxImgEl.src = lightboxImages[lightboxIndex];
    const multi = lightboxImages.length > 1;
    lightboxPrevBtn.style.display = multi ? 'flex' : 'none';
    lightboxNextBtn.style.display = multi ? 'flex' : 'none';
    lightboxCounterEl.style.display = multi ? 'block' : 'none';
    lightboxCounterEl.textContent = (lightboxIndex + 1) + ' / ' + lightboxImages.length;
  }

  function lightboxPrev() {
    lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
    showLightboxImage();
  }

  function lightboxNext() {
    lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
    showLightboxImage();
  }

  lightboxCloseBtn.addEventListener('click', closeLightbox);
  lightboxPrevBtn.addEventListener('click', lightboxPrev);
  lightboxNextBtn.addEventListener('click', lightboxNext);
  lightboxEl.addEventListener('click', (e) => {
    if (e.target === lightboxEl) closeLightbox(); // click on the dark backdrop closes it
  });
  document.addEventListener('keydown', (e) => {
    if (!lightboxEl.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') lightboxPrev();
    else if (e.key === 'ArrowRight') lightboxNext();
  });

  function isVisible(ev, now) {
    if (!ev.visibleFrom) return true;
    const vf = new Date(ev.visibleFrom);
    return now >= vf;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  // ---------- Admin: password modal ----------
  const adminBtn = document.getElementById('adminBtn');
  const pwBackdrop = document.getElementById('pwBackdrop');
  const pwInput = document.getElementById('pwInput');
  const pwError = document.getElementById('pwError');
  const pwSubmit = document.getElementById('pwSubmit');
  const pwCancel = document.getElementById('pwCancel');

  adminBtn.addEventListener('click', () => {
    pwInput.value = '';
    pwError.style.display = 'none';
    pwSubmit.disabled = false;
    pwSubmit.textContent = 'Bestätigen';
    pwBackdrop.classList.add('open');
    pwInput.focus();
  });
  pwCancel.addEventListener('click', () => pwBackdrop.classList.remove('open'));
  pwSubmit.addEventListener('click', tryLogin);
  pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });

  function tryLogin() {
    pwError.style.display = 'none';
    pwSubmit.disabled = true;
    pwSubmit.textContent = 'Prüfe…';
    signInWithEmailAndPassword(auth, ADMIN_EMAIL, pwInput.value)
      .then(() => {
        isAdmin = true;
        pwBackdrop.classList.remove('open');
        adminSelectedDate = selectedDate;
        openAdmin();
      })
      .catch(() => {
        pwError.textContent = 'Falsches Passwort.';
        pwError.style.display = 'block';
      })
      .finally(() => {
        pwSubmit.disabled = false;
        pwSubmit.textContent = 'Bestätigen';
      });
  }

  // ---------- Admin panel ----------
  const adminBackdrop = document.getElementById('adminBackdrop');
  const adminDaypicker = document.getElementById('adminDaypicker');
  const adminEventList = document.getElementById('adminEventList');
  const addEventTemplates = document.getElementById('addEventTemplates');
  const adminClose = document.getElementById('adminClose');
  const adminSave = document.getElementById('adminSave');

  Object.keys(TEMPLATES).forEach(key => {
    const tmpl = TEMPLATES[key];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn-add-template';
    b.textContent = '+ ' + tmpl.icon + ' ' + tmpl.label;
    b.addEventListener('click', () => {
      if (!tripData[adminSelectedDate]) tripData[adminSelectedDate] = { events: [] };
      tripData[adminSelectedDate].events.push({
        id: cryptoId(), templateType: key, title: 'Neues ' + tmpl.label,
        highlight: false, visibleFrom: null, fields: tmpl.build()
      });
      renderAdminEvents();
    });
    addEventTemplates.appendChild(b);
  });

  function openAdmin() {
    renderAdminDaypicker();
    renderAdminEvents();
    adminBackdrop.classList.add('open');
  }

  function renderAdminDaypicker() {
    adminDaypicker.innerHTML = '';
    ALL_DATES.forEach(date => {
      const { weekday, dm } = formatDayLabel(date);
      const b = document.createElement('button');
      b.textContent = weekday + ' ' + dm;
      b.className = date === adminSelectedDate ? 'active' : '';
      b.addEventListener('click', () => {
        adminSelectedDate = date;
        renderAdminDaypicker();
        renderAdminEvents();
      });
      adminDaypicker.appendChild(b);
    });
  }

  function renderAdminEvents() {
    adminEventList.innerHTML = '';
    const events = (tripData[adminSelectedDate] && tripData[adminSelectedDate].events) || [];
    if (events.length === 0) {
      const p = document.createElement('div');
      p.className = 'empty-note';
      p.textContent = 'Noch keine Events für diesen Tag.';
      adminEventList.appendChild(p);
    }
    events.forEach(ev => {
      adminEventList.appendChild(buildAdminEventRow(ev));
    });
  }

  function buildAdminEventRow(ev) {
    const wrap = document.createElement('div');
    wrap.className = 'admin-event';
    const tmplInfo = TEMPLATES[ev.templateType] || TEMPLATES.frei;

    const lockNoteHtml = () => ev.visibleFrom
      ? '<div class="lock-note">🔒 Für Gäste erst sichtbar ab: ' + new Date(ev.visibleFrom).toLocaleString('de-DE') + '</div>'
      : '<div class="lock-note">👁️ Für Gäste jederzeit sichtbar</div>';

    const header = document.createElement('div');
    header.innerHTML =
      '<div class="template-badge">' + tmplInfo.icon + ' ' + tmplInfo.label + '</div>' +
      lockNoteHtml() +
      '<label>Titel</label>' +
      '<input type="text" class="f-title" value="' + escapeAttr(ev.title) + '">' +
      '<div class="checkbox-row"><input type="checkbox" class="f-highlight" ' + (ev.highlight ? 'checked' : '') + '> Als Highlight markieren</div>' +
      '<label>Sichtbar für Gäste ab (leer lassen = immer sichtbar)</label>' +
      '<input type="datetime-local" class="f-visible" value="' + (ev.visibleFrom ? ev.visibleFrom.slice(0,16) : '') + '">';
    wrap.appendChild(header);

    header.querySelector('.f-title').addEventListener('input', e => ev.title = e.target.value);
    header.querySelector('.f-highlight').addEventListener('change', e => ev.highlight = e.target.checked);
    header.querySelector('.f-visible').addEventListener('input', e => {
      ev.visibleFrom = e.target.value ? e.target.value : null;
      header.querySelector('.lock-note').outerHTML = lockNoteHtml();
    });

    const fieldsContainer = document.createElement('div');
    fieldsContainer.className = 'fields-container';
    (ev.fields || []).forEach(field => {
      fieldsContainer.appendChild(buildFieldRow(ev, field));
    });
    wrap.appendChild(fieldsContainer);

    const addFieldRow = document.createElement('div');
    addFieldRow.className = 'add-field-row';
    Object.keys(FIELD_TYPE_INFO).forEach(type => {
      const info = FIELD_TYPE_INFO[type];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn-add-field';
      b.textContent = '+ ' + info.icon + ' ' + info.label;
      b.addEventListener('click', () => {
        if (!ev.fields) ev.fields = [];
        ev.fields.push(mkField(type));
        renderAdminEvents();
      });
      addFieldRow.appendChild(b);
    });
    wrap.appendChild(addFieldRow);

    const deleteWrap = document.createElement('div');
    deleteWrap.className = 'modal-actions';
    deleteWrap.innerHTML = '<button class="btn btn-danger f-delete">Event löschen</button>';
    deleteWrap.querySelector('.f-delete').addEventListener('click', () => {
      const list = tripData[adminSelectedDate].events;
      const i = list.findIndex(x => x.id === ev.id);
      if (i > -1) list.splice(i, 1);
      renderAdminEvents();
    });
    wrap.appendChild(deleteWrap);

    return wrap;
  }

  function buildFieldRow(ev, field) {
    const info = FIELD_TYPE_INFO[field.type];
    const row = document.createElement('div');
    row.className = 'field-row';

    const header = document.createElement('div');
    header.className = 'field-row-header';
    const labelSpan = document.createElement('span');
    labelSpan.className = 'field-label';
    labelSpan.textContent = info.icon + ' ' + info.label;
    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'field-remove';
    removeBtn.textContent = '✕ entfernen';
    removeBtn.addEventListener('click', () => {
      ev.fields = ev.fields.filter(f => f.id !== field.id);
      renderAdminEvents();
    });
    header.appendChild(labelSpan);
    header.appendChild(removeBtn);
    row.appendChild(header);

    if (field.type === 'time') {
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '14:00';
      input.value = field.value || '';
      input.addEventListener('input', e => field.value = e.target.value);
      row.appendChild(input);
    } else if (field.type === 'image') {
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Bild-URL';
      input.value = field.value || '';
      input.addEventListener('input', e => field.value = e.target.value);
      row.appendChild(input);
    } else if (field.type === 'link') {
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'https://...';
      input.value = field.value || '';
      input.addEventListener('input', e => field.value = e.target.value);
      row.appendChild(input);
    } else if (field.type === 'richtext') {
      const toolbar = document.createElement('div');
      toolbar.className = 'rte-toolbar';
      const editable = document.createElement('div');
      editable.className = 'rte-box';
      editable.contentEditable = 'true';
      editable.innerHTML = field.value || '';
      editable.addEventListener('input', () => field.value = editable.innerHTML);

      const mkBtn = (cmd, label, title) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = label;
        b.title = title;
        b.addEventListener('mousedown', e => {
          e.preventDefault();
          editable.focus();
          document.execCommand(cmd, false, null);
          field.value = editable.innerHTML;
        });
        return b;
      };
      toolbar.appendChild(mkBtn('bold', 'B', 'Fett'));
      toolbar.appendChild(mkBtn('italic', 'I', 'Kursiv'));
      toolbar.appendChild(mkBtn('underline', 'U', 'Unterstrichen'));
      toolbar.appendChild(mkBtn('strikeThrough', 'S', 'Durchgestrichen'));

      const sizeSelect = document.createElement('select');
      [['2','Klein'], ['3','Normal'], ['5','Groß'], ['7','Riesig']].forEach(([val, label]) => {
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = label;
        sizeSelect.appendChild(opt);
      });
      sizeSelect.value = '3';
      sizeSelect.addEventListener('mousedown', e => e.stopPropagation());
      sizeSelect.addEventListener('change', () => {
        editable.focus();
        document.execCommand('fontSize', false, sizeSelect.value);
        field.value = editable.innerHTML;
      });
      toolbar.appendChild(sizeSelect);

      row.appendChild(toolbar);
      row.appendChild(editable);
    }

    return row;
  }

  function escapeAttr(str) {
    return (str || '').replace(/"/g, '&quot;');
  }

  adminClose.addEventListener('click', () => {
    adminBackdrop.classList.remove('open');
    tripData = JSON.parse(JSON.stringify(lastSyncedData || defaultData())); // discard unsaved in-memory edits
    renderDay();
    signOut(auth).catch(() => {});
    isAdmin = false;
  });

  adminSave.addEventListener('click', () => {
    adminSave.disabled = true;
    adminSave.textContent = 'Speichert…';
    saveData()
      .then(() => {
        adminBackdrop.classList.remove('open');
        signOut(auth).catch(() => {});
        isAdmin = false;
      })
      .catch(err => {
        console.error(err);
        alert('Speichern fehlgeschlagen. Bitte Internetverbindung prüfen und erneut versuchen.');
      })
      .finally(() => {
        adminSave.disabled = false;
        adminSave.textContent = 'Speichern';
      });
  });

  // ---------- Weather: 7-day forecast for Basel & Bozen, starting from today ----------
  const WEATHER_LOCATIONS = [
    { name: 'Basel', lat: 47.5596, lon: 7.5886, elId: 'weatherBasel' },
    { name: 'Bozen', lat: 46.4983, lon: 11.3548, elId: 'weatherBozen' }
  ];

  function weatherIcon(code) {
    const map = {
      0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
      45: '🌫️', 48: '🌫️',
      51: '🌦️', 53: '🌦️', 55: '🌦️',
      56: '🌧️', 57: '🌧️',
      61: '🌧️', 63: '🌧️', 65: '🌧️',
      66: '🌨️', 67: '🌨️',
      71: '❄️', 73: '❄️', 75: '❄️', 77: '❄️',
      80: '🌦️', 81: '🌦️', 82: '⛈️',
      85: '🌨️', 86: '🌨️',
      95: '⛈️', 96: '⛈️', 99: '⛈️'
    };
    return map[code] || '🌡️';
  }

  async function loadWeather(loc) {
    const card = document.getElementById(loc.elId);
    const container = card.querySelector('.weather-days');
    try {
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat + '&longitude=' + loc.lon +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7';
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const days = data.daily.time;
      container.innerHTML = days.map((dateStr, i) => {
        const d = new Date(dateStr + 'T12:00:00');
        const wd = d.toLocaleDateString('de-DE', { weekday: 'short' });
        const code = data.daily.weather_code[i];
        const max = Math.round(data.daily.temperature_2m_max[i]);
        const min = Math.round(data.daily.temperature_2m_min[i]);
        return '<div class="weather-day-row"><span class="wd">' + wd + '</span>' +
          '<span class="icon">' + weatherIcon(code) + '</span>' +
          '<span class="temps">' + max + '°<span class="min">/' + min + '°</span></span></div>';
      }).join('');
    } catch (err) {
      console.error('Wetter konnte nicht geladen werden:', err);
      container.innerHTML = '<div style="color:var(--muted); font-size:0.78rem;">Wetter nicht verfügbar</div>';
    }
  }

  WEATHER_LOCATIONS.forEach(loadWeather);

  // ---------- Init ----------
  renderTabs();
  renderDay();
})();
</script>
</body>
</html>
